name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies and build libcint
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gfortran libopenblas-dev liblapacke-dev libnlopt-dev libcjson-dev libcurl4-openssl-dev
          make fetch-libcint

      - name: Build and run scientific test suite
        run: |
          make all
          make test

      - name: Run AddressSanitizer & UndefinedBehaviorSanitizer suite
        run: |
          make sanitize
