name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gfortran libopenblas-dev liblapacke-dev libnlopt-dev libcjson-dev libcurl4-openssl-dev
          make fetch-libcint

      - name: Build, test, and package portable tarball
        run: |
          make all
          make test
          make dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qchem-vqe-linux-x86_64
          path: build/qchem-vqe-linux-x86_64.tar.gz

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/qchem-vqe-linux-x86_64.tar.gz
          generate_release_notes: true
