# Controlled QPU experiment: H2 / cc-pVQZ / CAS(2,6), 12 qubits.
#
#   qchem-vqe experiment plan      # dry run: builds every arm and prints the plan
#   qchem-vqe experiment run       # submits all arms as ONE Estimator job (asks to type SUBMIT)
#   qchem-vqe experiment results JOB_ID
#
# Arms (all in the same job: same backend, qubits, calibration window, shots, seed):
#   bare_hf     X gates only                        readout-only control, exact E = E_HF
#   matched_hf  the VQE circuit with all angles 0   same gates and noise as vqe, exact E = E_HF
#   vqe         circuit preparing the VQE state     treatment

name             = h2_cas26
bond_angstrom    = 0.735
active_electrons = 2
active_orbitals  = 6

backend          = auto       # or a name, e.g. ibm_fez
ansatz           = givens     # givens (shallow, default) or uccsd (deep)
givens_trunc     = 1e-4       # natural-orbital weight the Givens circuit may drop

precision        = 0.02       # Estimator default_precision (target std. error per observable)
resilience_level = 1          # 0 none, 1 readout mitigation (TREX), 2 adds ZNE
seed             = 12345      # Estimator seed_estimator, for reproducible randomisation

arms             = bare_hf, matched_hf, vqe
